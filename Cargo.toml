[package]
name = "engineering-challenge"
version = "0.1.0"
edition = "2024"
build = "src/util/build.rs"
default-run = "engineering-challenge"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
chrono = "0.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossbeam = "0.8.4"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "http2"] }
rsa = { version = "0.9.10", features = ["getrandom", "sha2"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
ergo-sbe = "=0.1.16"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.9"
